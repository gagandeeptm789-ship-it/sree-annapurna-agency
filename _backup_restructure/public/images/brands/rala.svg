          <circle cx="16" cy="17" r="4" fill="#C98A2C"/>
          <text x="30" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#243029">Single-Origin Chilli, Turmeric, Coriander</text>
        </g>
      
        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="340" height="34" rx="4" fill="#faf8f3" stroke="#e8e2d5" stroke-width="1"/>
          <circle cx="16" cy="17" r="4" fill="#C98A2C"/>
          <text x="30" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#243029">Specialist Chicken & Meat Blends</text>
        </g>
      
        <g transform="translate(0, 44)">
          <rect x="0" y="0" width="340" height="34" rx="4" fill="#faf8f3" stroke="#e8e2d5" stroke-width="1"/>
          <circle cx="16" cy="17" r="4" fill="#C98A2C"/>
          <text x="30" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#243029">Aromatic Garam Masala Pouches</text>
