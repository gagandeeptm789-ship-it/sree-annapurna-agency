      <path d="M 250 282 Q 270 350 298 420" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.8"/>
    
      <path d="M 250 282 Q 280 350 315 420" stroke="#713f12" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 250 282 Q 275 350 310 420" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.8"/>
    
      <path d="M 250 282 Q 286 350 328 420" stroke="#713f12" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 250 282 Q 280 350 322 420" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.8"/>
    

    <!-- Bottom Bristle Trim Edge with Natural Tips -->
    <path d="M 160 420 Q 250 430 340 420" stroke="#713f12" stroke-width="3" fill="none"/>
  </g>

  <!-- Quality Stamp -->
  <g transform="translate(320, 120)">
    <circle cx="20" cy="20" r="20" fill="url(#gold-foil)" stroke="#854d0e" stroke-width="1"/>
    <text x="20" y="16" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#78350f" text-anchor="middle">SUPER</text>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#78350f" text-anchor="middle">CLEAN</text>
  </g>
</svg>
