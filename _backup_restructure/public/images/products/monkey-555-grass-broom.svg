      <path d="M 250 282 Q 260 350 274 420" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.8"/>
    
      <path d="M 250 282 Q 268 350 289 420" stroke="#713f12" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 250 282 Q 265 350 286 420" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.8"/>
    
