      <path d="M 277 240 C 286 320, 313 380, 313 420" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    

    <!-- Looped ends at bottom -->
    
      <ellipse cx="185" cy="420" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
      <ellipse cx="200.6" cy="420" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
